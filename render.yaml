services:
  - type: web
    name: dreamlistenbar-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npx playwright install chromium
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # 可选：配置代理（如果有代理服务）
      # - key: PROXY_SERVER
      #   value: http://your-proxy-server:port
